[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-analytics"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.2",
    "opencv-python>=4.9",
    "torch>=2.2",
    "torchvision>=0.17",
    "rich>=13.0",
    "pyyaml>=6.0",
    "supervision>=0.29.0.post0",
    "typer>=0.9",
]

[project.scripts]
run-match = "src.pipeline.run_match:run_cli"
eval-tracks = "src.evaluation.cli:run_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "motmetrics>=1.4.0",
    "trackeval>=1.3.0",
]
